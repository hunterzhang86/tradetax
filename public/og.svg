<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="0.55" stop-color="#0a0d16"/>
      <stop offset="1" stop-color="#0d0a18"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.45" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="1" cy="1" r="0.8">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- 网格 -->
  <g stroke="#1c2333" stroke-opacity="0.5">
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo -->
  <rect x="72" y="70" width="96" height="96" rx="22" fill="#05060a"/>
  <rect x="74" y="72" width="92" height="92" rx="20" fill="none" stroke="url(#brand)" stroke-width="4"/>
  <path d="M96 138 L120 108 L132 118 L156 86" stroke="url(#brand)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M136 86 L156 86 L156 106" stroke="url(#brand)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 标题 -->
  <text x="72" y="236" font-family="Inter, PingFang SC, -apple-system, sans-serif" font-size="76" font-weight="700" fill="url(#title)" filter="url(#softGlow)">TradeTax</text>
  <text x="74" y="308" font-family="PingFang SC, Inter, -apple-system, sans-serif" font-size="40" font-weight="600" fill="#e5e7eb">港美股投资个税计算器</text>

  <!-- 标语 -->
  <text x="74" y="380" font-family="PingFang SC, Inter, -apple-system, sans-serif" font-size="24" fill="#9ca3af">上传富途 / 老虎 / 长桥账单 → 自动核算 FIFO / HIFO / 加权平均成本</text>
  <text x="74" y="420" font-family="PingFang SC, Inter, -apple-system, sans-serif" font-size="24" fill="#9ca3af">资本利得 · 股息 · 利息三税种, 年度汇率自动折算</text>

  <!-- 隐私徽标 -->
  <rect x="74" y="452" width="248" height="46" rx="23" fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.4"/>
  <circle cx="100" cy="475" r="7" fill="#34d399"/>
  <text x="116" y="482" font-family="PingFang SC, Inter, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#6ee7b7">数据不出浏览器 · 100% 本地计算</text>

  <!-- 券商 chips -->
  <g font-family="PingFang SC, Inter, -apple-system, sans-serif" font-size="22" font-weight="500">
    <rect x="740" y="120" width="176" height="56" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="828" y="156" text-anchor="middle" fill="#d1d5db">富途牛牛</text>
    <rect x="740" y="192" width="176" height="56" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="828" y="228" text-anchor="middle" fill="#d1d5db">老虎国际</text>
    <rect x="740" y="264" width="176" height="56" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="828" y="300" text-anchor="middle" fill="#d1d5db">长桥</text>
  </g>

  <!-- 右上角装饰 -->
  <text x="1030" y="120" font-family="ui-monospace, monospace" font-size="20" fill="#22d3ee" fill-opacity="0.8">// 本地计算</text>
  <text x="1030" y="152" font-family="ui-monospace, monospace" font-size="20" fill="#a78bfa" fill-opacity="0.8">// 零上传</text>
</svg>
